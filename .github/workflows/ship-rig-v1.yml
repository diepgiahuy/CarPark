name: Ship Rig v1

on:
  push:
    branches: [ship-rig-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Apply visual QC patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ship_rig_v1.py')
          s=p.read_text()
          s=s.replace("scene.world.color = (0.025, 0.035, 0.05)", "scene.world.color = (0.055, 0.075, 0.10)")
          s=s.replace("hull.data.materials.append(hull_blue); hull.parent=attitude", "hull.data.materials.append(hull_blue); hull.data.materials.append(hull_red); hull.parent=attitude\nfor poly in hull.data.polygons:\n    poly.material_index = 1 if poly.center.z < 0.0 else 0")
          s=s.replace("red_band = box('HULL_RED_BAND',(0,-3,-5.5),(25.3,165,5.5),hull_red,attitude,0.4)", "# lower hull red paint is assigned directly on HULL_MAIN")
          s=s.replace("cam_ext = new_camera('CAM_EXTERIOR',(-105,-235,80),(0,5,12),44,None)", "cam_ext = new_camera('CAM_EXTERIOR',(-185,-385,105),(0,5,14),45,None)")
          s=s.replace("cam_pov = new_camera('CAM_BRIDGE_POV',(0,-121.5,34.2),(0,115,13.0),25,cam_ctrl)", "cam_pov = new_camera('CAM_BRIDGE_POV',(0,-119.5,34.7),(0,145,14.0),24,cam_ctrl)")
          s=s.replace("sun.data.energy=2.4", "sun.data.energy=3.2")
          old='''def render_still(cam, frame, path, w, h):\n    scene.camera=cam\n    scene.frame_set(frame)\n    scene.render.resolution_x=w; scene.render.resolution_y=h\n    scene.render.filepath=path\n    bpy.ops.render.render(write_still=True)'''
          new='''def render_still(cam, frame, path, w, h):\n    scene.camera=cam\n    scene.frame_set(frame)\n    scene.render.resolution_x=w; scene.render.resolution_y=h\n    scene.render.filepath=path\n    hidden=[]\n    if cam.name == 'CAM_BRIDGE_POV':\n        for name in ['BRIDGE_HOUSE'] + [f'EXT_BRIDGE_GLASS_{x}' for x in (-18,-12,-6,0,6,12,18)]:\n            ob=bpy.data.objects.get(name)\n            if ob:\n                hidden.append((ob,ob.hide_render)); ob.hide_render=True\n    bpy.context.view_layer.update()\n    bpy.ops.render.render(write_still=True)\n    for ob,state in hidden:\n        ob.hide_render=state\n    bpy.context.view_layer.update()'''
          if old not in s:
              raise SystemExit('render_still block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Build rig and previews
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python ship_rig_v1.py | tee blender.log
          grep -q SHIP_RIG_V1_PASS blender.log

      - name: Verify outputs
        run: |
          test -s artifacts/THE_NEXT_WAVE_ship_rig_v1.blend
          test -s artifacts/01_exterior.png
          test -s artifacts/02_bridge_pov.png
          test -s artifacts/03_rig_motion.png
          test -s artifacts/RIG_README.txt
          python3 - <<'PY'
          from pathlib import Path
          files=[
              Path('artifacts/01_exterior.png'),
              Path('artifacts/02_bridge_pov.png'),
              Path('artifacts/03_rig_motion.png'),
              Path('artifacts/THE_NEXT_WAVE_ship_rig_v1.blend')
          ]
          assert all(p.stat().st_size > 5000 for p in files), [(p.name,p.stat().st_size) for p in files]
          print('SHIP_RIG_VERIFY_PASS')
          PY

      - name: Upload ship rig
        uses: actions/upload-artifact@v4
        with:
          name: the-next-wave-ship-rig-v1
          path: |
            artifacts/THE_NEXT_WAVE_ship_rig_v1.blend
            artifacts/01_exterior.png
            artifacts/02_bridge_pov.png
            artifacts/03_rig_motion.png
            artifacts/RIG_README.txt
            blender.log
