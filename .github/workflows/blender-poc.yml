name: Blender Ship POC

on:
  push:
    branches: [blender-poc]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Patch quick raised-bridge POC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('blender_poc.py')
          s=p.read_text()
          s=s.replace("BLENDER_EEVEE_NEXT","BLENDER_EEVEE")
          s=s.replace("scene.render.resolution_x = 540","scene.render.resolution_x = 360")
          s=s.replace("scene.render.resolution_y = 960","scene.render.resolution_y = 640")
          s=s.replace("frames=[1,30,60,90,120]","frames=[30]")
          marker="# ---------- render 5 proof frames ----------"
          patch='''# raise bridge to realistic container-ship bridge height after visual QC\nbridge_prefixes = (\"Bridge\", \"Window\", \"Console\", \"Monitor\", \"Screen\", \"Wheel\", \"Throttle\", \"Alarm\", \"Wiper\", \"LeftWall\", \"RightWall\")\nfor ob in bpy.data.objects:\n    if ob.name.startswith(bridge_prefixes):\n        ob.location.z += 9.5\ncam.location = (0, -12.5, 14.8)\ncam.data.lens = 24\nlook_at(cam, (0, 62, 1.8))\n'''
          s=s.replace(marker,patch+'\n'+marker)
          p.write_text(s)
          PY

      - name: Render quick POC
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python blender_poc.py | tee blender.log
          grep -q POC_RENDER_PASS blender.log

      - name: Verify frame
        run: |
          test -s artifacts/THE_NEXT_WAVE_POC.blend
          test -s artifacts/poc_030.png
          test $(stat -c%s artifacts/poc_030.png) -gt 5000
          echo FRAME_CHECK_PASS

      - name: Upload POC
        uses: actions/upload-artifact@v4
        with:
          name: the-next-wave-poc-raised-bridge
          path: |
            artifacts/poc_030.png
            artifacts/THE_NEXT_WAVE_POC.blend
            blender.log
